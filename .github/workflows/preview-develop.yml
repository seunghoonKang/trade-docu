name: Deploy Preview (develop)

# Explicitly deploy a Vercel Preview whenever `develop` is updated.
# Uses the official Vercel CLI flow (pull env → build → deploy --prebuilt).
on:
  push:
    branches: [develop]

# One preview at a time; newer pushes supersede in-flight deploys.
concurrency:
  group: preview-develop
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls Preview-scoped env vars (incl. VITE_SUPABASE_*) and project settings.
      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Builds with the project's detected settings (pnpm via lockfile → `pnpm build`).
      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "$url"
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish preview URL to job summary
        run: |
          {
            echo "### 🔍 Preview deployed"
            echo ""
            echo "**develop** → ${{ steps.deploy.outputs.preview_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
